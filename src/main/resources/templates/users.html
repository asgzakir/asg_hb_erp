<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>User Management</title></head>
<body>
<div th:replace="fragments/layout :: layout (~{::title='Users'}, ~{::content=~{::content}})"></div>

<div th:fragment="content">
    <h2>Users</h2>
    <a th:href="@{/admin/users/new}">New User</a>
    <table>
        <thead><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Roles</th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:each="r : ${u.roles}" th:text="${r.name} + ' '"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
