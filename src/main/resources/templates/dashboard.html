<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/layout :: layout (~{::title='Dashboard'}, ~{::content=~{::content}})">
</th:block>

<!-- content fragment to inject -->
<div th:fragment="content">
    <h1>Welcome, <span th:text="${fullName}">User</span></h1>
    <p>Roles: <span th:each="r : ${roles}" th:text="${r} + ' '"></span></p>
    <p>Use the sidebar to navigate.</p>
</div>
</html>
